name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-sqlite:
    name: linux / gcc 16 / sqlite
    runs-on: ubuntu-latest
    container: gcc:16
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build git ca-certificates

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENTITYFY_ENABLE_SQLITE=ON \
            -DENTITYFY_ENABLE_POSTGRESQL=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-postgresql:
    name: linux / gcc 16 / postgresql
    runs-on: ubuntu-latest
    container: gcc:16
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: entityfy_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build git ca-certificates libpq-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENTITYFY_ENABLE_SQLITE=ON \
            -DENTITYFY_ENABLE_POSTGRESQL=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        env:
          ENTITYFY_PG_URI: postgresql://postgres:postgres@postgres:5432/entityfy_test
          ENTITYFY_REQUIRE_PG: "1"
        run: ctest --test-dir build --output-on-failure

  linux-mysql:
    name: linux / gcc 16 / mysql
    runs-on: ubuntu-latest
    container: gcc:16
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: entityfy_test
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build git ca-certificates libmariadb-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENTITYFY_ENABLE_SQLITE=ON \
            -DENTITYFY_ENABLE_POSTGRESQL=OFF \
            -DENTITYFY_ENABLE_MYSQL=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        env:
          ENTITYFY_MYSQL_URI: mysql://root:secret@mariadb:3306/entityfy_test
          ENTITYFY_REQUIRE_MYSQL: "1"
        run: ctest --test-dir build --output-on-failure

  linux-sqlserver:
    name: linux / gcc 16 / sqlserver
    runs-on: ubuntu-latest
    container: gcc:16
    timeout-minutes: 45
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Str0ng!Passw0rd' -C -Q 'SELECT 1' -b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools and the ODBC driver
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends curl gnupg ca-certificates cmake ninja-build git unixodbc-dev
          # The Microsoft keyring is not trusted by sqv on Debian 13; the CI
          # container pins the official repository, so trust it explicitly.
          echo "deb [trusted=yes] https://packages.microsoft.com/debian/13/prod trixie main" \
            > /etc/apt/sources.list.d/mssql-release.list
          apt-get update
          ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18 mssql-tools18

      - name: Create the test database
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P 'Str0ng!Passw0rd' -C -b \
            -Q "IF DB_ID('entityfy_test') IS NULL CREATE DATABASE entityfy_test"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENTITYFY_ENABLE_SQLITE=ON \
            -DENTITYFY_ENABLE_POSTGRESQL=OFF \
            -DENTITYFY_ENABLE_SQLSERVER=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        env:
          ENTITYFY_SQLSERVER_URI: sqlserver://sa:Str0ng!Passw0rd@mssql:1433/entityfy_test
          ENTITYFY_REQUIRE_SQLSERVER: "1"
        run: ctest --test-dir build --output-on-failure
