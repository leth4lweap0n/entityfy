name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-sqlite:
    name: linux / gcc 16 / sqlite
    runs-on: ubuntu-24.04
    container: gcc:16@sha256:43978d7710a803d1c3d32f4117c1528ec7285a4ce2c0a51e982ec1a6e3d87d95
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build git ca-certificates

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENTITYFY_BUILD_TESTS=ON \
            -DBUILD_TESTING=ON \
            -DENTITYFY_ENABLE_SQLITE=ON \
            -DENTITYFY_ENABLE_POSTGRESQL=OFF

      - name: Verify the SQLite backend is enabled
        run: grep -q '^ENTITYFY_ENABLE_SQLITE:BOOL=ON$' build/CMakeCache.txt

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  linux-postgresql:
    name: linux / gcc 16 / postgresql
    runs-on: ubuntu-24.04
    container: gcc:16@sha256:43978d7710a803d1c3d32f4117c1528ec7285a4ce2c0a51e982ec1a6e3d87d95
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: entityfy_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period=30s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build git ca-certificates libpq-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENTITYFY_BUILD_TESTS=ON \
            -DBUILD_TESTING=ON \
            -DENTITYFY_ENABLE_SQLITE=ON \
            -DENTITYFY_ENABLE_POSTGRESQL=ON

      - name: Verify the backends are enabled
        run: |
          grep -q '^ENTITYFY_ENABLE_SQLITE:BOOL=ON$' build/CMakeCache.txt
          grep -q '^ENTITYFY_ENABLE_POSTGRESQL:BOOL=ON$' build/CMakeCache.txt

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        env:
          ENTITYFY_PG_URI: postgresql://postgres:postgres@postgres:5432/entityfy_test
          ENTITYFY_REQUIRE_PG: "1"
        run: ctest --test-dir build --output-on-failure --no-tests=error

  linux-mysql:
    name: linux / gcc 16 / mysql
    runs-on: ubuntu-24.04
    container: gcc:16@sha256:43978d7710a803d1c3d32f4117c1528ec7285a4ce2c0a51e982ec1a6e3d87d95
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.4@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: entityfy_test
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period=30s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build git ca-certificates libmariadb-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENTITYFY_BUILD_TESTS=ON \
            -DBUILD_TESTING=ON \
            -DENTITYFY_ENABLE_SQLITE=ON \
            -DENTITYFY_ENABLE_POSTGRESQL=OFF \
            -DENTITYFY_ENABLE_MYSQL=ON

      - name: Verify the MySQL backend is enabled
        run: |
          grep -q '^ENTITYFY_ENABLE_SQLITE:BOOL=ON$' build/CMakeCache.txt
          grep -q '^ENTITYFY_ENABLE_MYSQL:BOOL=ON$' build/CMakeCache.txt

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        env:
          ENTITYFY_MYSQL_URI: mysql://root:secret@mariadb:3306/entityfy_test
          ENTITYFY_REQUIRE_MYSQL: "1"
        run: ctest --test-dir build --output-on-failure --no-tests=error

  linux-sqlserver:
    name: linux / gcc 16 / sqlserver
    runs-on: ubuntu-24.04
    container: gcc:16@sha256:43978d7710a803d1c3d32f4117c1528ec7285a4ce2c0a51e982ec1a6e3d87d95
    timeout-minutes: 45
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng;Passw0rd"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Str0ng;Passw0rd' -C -Q 'SELECT 1' -b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period=30s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install tools and the ODBC driver
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends curl gnupg ca-certificates cmake ninja-build git unixodbc-dev
          # microsoft.asc is the legacy SHA1 key; Debian 13's sqv rejects it.
          # microsoft-2025.asc carries the SHA1-free key that signs this repo.
          curl -sSL https://packages.microsoft.com/keys/microsoft-2025.asc |
            gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/debian/13/prod trixie main" \
            > /etc/apt/sources.list.d/mssql-release.list
          apt-get update
          ACCEPT_EULA=Y apt-get install -y --no-install-recommends msodbcsql18 mssql-tools18

      - name: Create the test database
        env:
          SQLCMDPASSWORD: "Str0ng;Passw0rd"
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -C -b \
            -Q "IF DB_ID('entityfy_test') IS NULL CREATE DATABASE entityfy_test"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENTITYFY_BUILD_TESTS=ON \
            -DBUILD_TESTING=ON \
            -DENTITYFY_ENABLE_SQLITE=ON \
            -DENTITYFY_ENABLE_POSTGRESQL=OFF \
            -DENTITYFY_ENABLE_SQLSERVER=ON

      - name: Verify the SQL Server backend is enabled
        run: |
          grep -q '^ENTITYFY_ENABLE_SQLITE:BOOL=ON$' build/CMakeCache.txt
          grep -q '^ENTITYFY_ENABLE_SQLSERVER:BOOL=ON$' build/CMakeCache.txt

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        env:
          ENTITYFY_SQLSERVER_URI: mssql://sa:Str0ng%3BPassw0rd@mssql:1433/entityfy_test?mars=1
          ENTITYFY_REQUIRE_SQLSERVER: "1"
        run: ctest --test-dir build --output-on-failure --no-tests=error

  windows-sqlite:
    name: windows / gcc 16 / sqlite
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install GCC 16
        shell: pwsh
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r2/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r2.7z"
          $expected = "53fb6773fbdf87cdf22b69a6b2a07ee33d3ada413b42d83044bc7cc6481400d2"
          Invoke-WebRequest -Uri $url -OutFile gcc16.7z
          $actual = (Get-FileHash gcc16.7z -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "GCC archive checksum mismatch: $actual" }
          7z x gcc16.7z -oC:\gcc16 -y | Out-Null
          Add-Content $env:GITHUB_PATH "C:\gcc16\mingw64\bin"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_CXX_COMPILER=g++ `
            -DENTITYFY_BUILD_TESTS=ON `
            -DBUILD_TESTING=ON `
            -DENTITYFY_ENABLE_SQLITE=ON `
            -DENTITYFY_ENABLE_POSTGRESQL=OFF

      - name: Verify the SQLite backend is enabled
        run: |
          $cache = Get-Content build/CMakeCache.txt
          if (-not ($cache -match '^ENTITYFY_ENABLE_SQLITE:BOOL=ON$')) { throw "SQLite backend is disabled" }

      - name: Build
        run: cmake --build build --parallel $env:NUMBER_OF_PROCESSORS

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
